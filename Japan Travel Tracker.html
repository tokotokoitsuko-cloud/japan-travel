<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日本旅マップ - Japan Travel Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        jp: {
                            red: '#E60012',
                            visited: '#10B981', // Emerald green
                            planned: '#3B82F6', // Blue
                            unvisited: '#E2E8F0' // Slate 200
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            touch-action: manipulation;
            font-family: 'Noto Sans JP', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Map SVG styling */
        .pref-path {
            transition: all 0.2s ease;
            cursor: pointer;
            stroke: #ffffff;
            stroke-width: 1.5;
            stroke-linejoin: round;
        }
        .pref-path:hover, .pref-path:active {
            opacity: 0.85;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.2));
        }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased bg-slate-100">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-jp-red text-white flex items-center justify-center font-bold text-lg shadow-sm">
                <i class="fa-solid font-bold text-sm">旅</i>
            </div>
            <h1 class="font-extrabold text-lg text-slate-900 tracking-tight">日本旅マップ</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button id="export-btn" title="データ出力" class="p-2 text-slate-600 hover:text-slate-900 text-sm bg-slate-100 rounded-lg active:scale-95 transition">
                <i class="fa-solid fa-download"></i>
            </button>
            <button id="import-btn" title="データ復元" class="p-2 text-slate-600 hover:text-slate-900 text-sm bg-slate-100 rounded-lg active:scale-95 transition">
                <i class="fa-solid fa-upload"></i>
            </button>
            <input type="file" id="import-file" class="hidden" accept=".json">
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 overflow-y-auto pb-24">
        
        <!-- Summary Banner / Progress -->
        <section class="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-4 shadow-md">
            <div class="max-w-md mx-auto">
                <div class="flex justify-between items-end mb-2">
                    <div>
                        <span class="text-xs text-slate-400 font-medium">訪問達成度</span>
                        <div class="flex items-baseline space-x-1">
                            <span id="visited-count" class="text-3xl font-black text-emerald-400">0</span>
                            <span class="text-lg text-slate-300 font-bold">/ 47</span>
                            <span class="text-xs text-slate-400 ml-1">都道府県</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <span id="progress-percent" class="text-2xl font-black text-white">0%</span>
                    </div>
                </div>
                
                <!-- Progress Bar -->
                <div class="w-full bg-slate-700 h-3 rounded-full overflow-hidden flex">
                    <div id="bar-visited" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
                    <div id="bar-planned" class="bg-blue-500 h-full transition-all duration-500" style="width: 0%"></div>
                </div>

                <!-- Legend / Status overview -->
                <div class="flex justify-between text-xs mt-3 pt-2 border-t border-slate-700/60 text-slate-300">
                    <div class="flex items-center space-x-1.5">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                        <span>訪問済み: <strong id="legend-visited" class="text-white">0</strong></span>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                        <span>計画中: <strong id="legend-planned" class="text-white">0</strong></span>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <span class="w-3 h-3 rounded-full bg-slate-400 inline-block"></span>
                        <span>未訪問: <strong id="legend-unvisited" class="text-white">47</strong></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW 1: MAP VIEW -->
        <div id="view-map" class="view-content p-4 max-w-lg mx-auto">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-map-location-dot text-jp-red"></i> 都道府県マップ
                    </h2>
                    <span class="text-xs text-slate-400">タップして記録・編集</span>
                </div>
                
                <!-- Interactive SVG Map of Japan -->
                <div class="relative w-full aspect-[4/5] bg-slate-50 rounded-xl p-2 border border-slate-100 flex items-center justify-center overflow-hidden">
                    <svg id="japan-map" viewBox="0 0 800 1000" class="w-full h-full select-none">
                        <!-- Hokkaido -->
                        <path id="pref-1" class="pref-path" data-id="1" data-name="北海道" d="M620,120 L750,110 L780,180 L730,260 L650,250 L610,210 L580,220 L570,180 Z"/>
                        
                        <!-- Tohoku -->
                        <path id="pref-2" class="pref-path" data-id="2" data-name="青森県" d="M600,280 L660,280 L670,330 L600,340 Z"/>
                        <path id="pref-3" class="pref-path" data-id="3" data-name="岩手県" d="M635,340 L675,340 L665,410 L625,410 Z"/>
                        <path id="pref-4" class="pref-path" data-id="4" data-name="宮城県" d="M625,410 L665,410 L655,460 L620,460 Z"/>
                        <path id="pref-5" class="pref-path" data-id="5" data-name="秋田県" d="M595,340 L635,340 L625,410 L590,410 Z"/>
                        <path id="pref-6" class="pref-path" data-id="6" data-name="山形県" d="M590,410 L625,410 L620,460 L585,460 Z"/>
                        <path id="pref-7" class="pref-path" data-id="7" data-name="福島県" d="M585,460 L655,460 L645,520 L580,520 Z"/>

                        <!-- Kanto -->
                        <path id="pref-8" class="pref-path" data-id="8" data-name="茨城県" d="M610,520 L650,520 L640,570 L605,570 Z"/>
                        <path id="pref-9" class="pref-path" data-id="9" data-name="栃木県" d="M570,520 L610,520 L605,570 L570,570 Z"/>
                        <path id="pref-10" class="pref-path" data-id="10" data-name="群馬県" d="M530,520 L570,520 L570,570 L530,570 Z"/>
                        <path id="pref-11" class="pref-path" data-id="11" data-name="埼玉県" d="M535,570 L605,570 L600,600 L535,600 Z"/>
                        <path id="pref-12" class="pref-path" data-id="12" data-name="千葉県" d="M605,570 L640,570 L630,640 L595,620 Z"/>
                        <path id="pref-13" class="pref-path" data-id="13" data-name="東京都" d="M535,600 L595,600 L590,625 L535,620 Z"/>
                        <path id="pref-14" class="pref-path" data-id="14" data-name="神奈川県" d="M535,620 L590,625 L580,655 L530,645 Z"/>

                        <!-- Chubu -->
                        <path id="pref-15" class="pref-path" data-id="15" data-name="新潟県" d="M530,460 L585,460 L570,520 L515,520 Z"/>
                        <path id="pref-16" class="pref-path" data-id="16" data-name="富山県" d="M465,500 L515,500 L510,540 L465,530 Z"/>
                        <path id="pref-17" class="pref-path" data-id="17" data-name="石川県" d="M445,450 L470,450 L465,530 L440,510 Z"/>
                        <path id="pref-18" class="pref-path" data-id="18" data-name="福井県" d="M420,530 L465,530 L450,570 L410,560 Z"/>
                        <path id="pref-19" class="pref-path" data-id="19" data-name="山梨県" d="M500,570 L535,570 L530,610 L495,600 Z"/>
                        <path id="pref-20" class="pref-path" data-id="20" data-name="長野県" d="M480,520 L530,520 L500,600 L465,570 Z"/>
                        <path id="pref-21" class="pref-path" data-id="21" data-name="岐阜県" d="M440,540 L480,530 L465,610 L430,600 Z"/>
                        <path id="pref-22" class="pref-path" data-id="22" data-name="静岡県" d="M495,600 L580,620 L560,660 L485,640 Z"/>
                        <path id="pref-23" class="pref-path" data-id="23" data-name="愛知県" d="M435,600 L485,600 L480,650 L430,640 Z"/>

                        <!-- Kansai -->
                        <path id="pref-24" class="pref-path" data-id="24" data-name="三重県" d="M410,610 L435,600 L425,680 L395,660 Z"/>
                        <path id="pref-25" class="pref-path" data-id="25" data-name="滋賀県" d="M395,560 L430,560 L420,610 L385,600 Z"/>
                        <path id="pref-26" class="pref-path" data-id="26" data-name="京都府" d="M365,550 L400,550 L385,610 L355,590 Z"/>
                        <path id="pref-27" class="pref-path" data-id="27" data-name="大阪府" d="M355,610 L385,610 L380,655 L350,645 Z"/>
                        <path id="pref-28" class="pref-path" data-id="28" data-name="兵庫県" d="M315,560 L365,550 L355,630 L310,610 Z"/>
                        <path id="pref-29" class="pref-path" data-id="29" data-name="奈良県" d="M385,610 L410,610 L400,660 L375,660 Z"/>
                        <path id="pref-30" class="pref-path" data-id="30" data-name="和歌山県" d="M350,655 L400,660 L385,715 L340,700 Z"/>

                        <!-- Chugoku -->
                        <path id="pref-31" class="pref-path" data-id="31" data-name="鳥取県" d="M260,560 L315,560 L310,595 L260,590 Z"/>
                        <path id="pref-32" class="pref-path" data-id="32" data-name="島根県" d="M200,570 L260,560 L260,590 L200,600 Z"/>
                        <path id="pref-33" class="pref-path" data-id="33" data-name="岡山県" d="M260,590 L310,595 L300,635 L255,625 Z"/>
                        <path id="pref-34" class="pref-path" data-id="34" data-name="広島県" d="M200,600 L255,590 L250,635 L195,625 Z"/>
                        <path id="pref-35" class="pref-path" data-id="35" data-name="山口県" d="M145,600 L200,600 L195,640 L140,630 Z"/>

                        <!-- Shikoku -->
                        <path id="pref-36" class="pref-path" data-id="36" data-name="徳島県" d="M280,670 L320,660 L300,710 L270,700 Z"/>
                        <path id="pref-37" class="pref-path" data-id="37" data-name="香川県" d="M260,645 L310,640 L305,670 L260,670 Z"/>
                        <path id="pref-38" class="pref-path" data-id="38" data-name="愛媛県" d="M205,660 L260,650 L245,710 L195,690 Z"/>
                        <path id="pref-39" class="pref-path" data-id="39" data-name="高知県" d="M205,690 L270,700 L260,745 L195,730 Z"/>

                        <!-- Kyushu & Okinawa -->
                        <path id="pref-40" class="pref-path" data-id="40" data-name="福岡県" d="M110,650 L155,645 L150,690 L110,680 Z"/>
                        <path id="pref-41" class="pref-path" data-id="41" data-name="佐賀県" d="M70,660 L110,650 L105,690 L70,680 Z"/>
                        <path id="pref-42" class="pref-path" data-id="42" data-name="長崎県" d="M30,660 L70,660 L60,715 L25,700 Z"/>
                        <path id="pref-43" class="pref-path" data-id="43" data-name="熊本県" d="M85,690 L135,690 L125,745 L75,735 Z"/>
                        <path id="pref-44" class="pref-path" data-id="44" data-name="大分県" d="M135,670 L170,660 L165,710 L130,700 Z"/>
                        <path id="pref-45" class="pref-path" data-id="45" data-name="宮崎県" d="M125,710 L165,710 L155,775 L115,765 Z"/>
                        <path id="pref-46" class="pref-path" data-id="46" data-name="鹿児島県" d="M65,745 L120,745 L105,825 L50,810 Z"/>
                        
                        <!-- Okinawa Inset Frame -->
                        <g transform="translate(40, 830)">
                            <rect x="0" y="0" width="160" height="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8"/>
                            <text x="10" y="20" font-size="14" font-weight="bold" fill="#64748b">沖縄県</text>
                            <path id="pref-47" class="pref-path" data-id="47" data-name="沖縄県" d="M30,50 L130,40 L140,80 L40,90 Z"/>
                        </g>
                    </svg>
                </div>
            </div>
        </div>

        <!-- VIEW 2: LIST VIEW -->
        <div id="view-list" class="view-content p-4 max-w-lg mx-auto hidden">
            <!-- Search & Filter -->
            <div class="mb-4 flex gap-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="都道府県名で検索..." class="w-full pl-9 pr-4 py-2 bg-white rounded-xl text-sm border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-900">
                </div>
                <select id="status-filter" class="bg-white border border-slate-200 rounded-xl text-sm px-3 py-2 focus:outline-none font-medium text-slate-700">
                    <option value="all">すべて</option>
                    <option value="visited">訪問済み</option>
                    <option value="planned">計画中</option>
                    <option value="unvisited">未訪問</option>
                </select>
            </div>

            <!-- List items container -->
            <div id="prefecture-list" class="space-y-2.5">
                <!-- Dynamically populated via JS -->
            </div>
        </div>

        <!-- VIEW 3: STATS VIEW -->
        <div id="view-stats" class="view-content p-4 max-w-lg mx-auto hidden space-y-4">
            <!-- Financial Overview -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">総旅行費用（記録分）</h3>
                <div class="text-3xl font-black text-slate-900 mb-4" id="total-expense">¥0</div>

                <div class="border-t border-slate-100 pt-4 space-y-2 text-sm">
                    <div class="flex justify-between text-slate-600">
                        <span>記録件数</span>
                        <span id="recorded-count" class="font-bold text-slate-800">0 都道府県</span>
                    </div>
                    <div class="flex justify-between text-slate-600">
                        <span>1件あたりの平均費用</span>
                        <span id="avg-expense" class="font-bold text-slate-800">¥0</span>
                    </div>
                </div>
            </div>

            <!-- Transportation breakdown -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-route text-emerald-500"></i> 利用された交通手段
                </h3>
                <div id="trans-stats-list" class="space-y-3">
                    <!-- Populated via JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 z-30 px-6 py-2">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button data-target="view-map" class="nav-tab active flex flex-col items-center py-1 text-emerald-600 transition">
                <i class="fa-solid fa-map text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">マップ</span>
            </button>
            <button data-target="view-list" class="nav-tab flex flex-col items-center py-1 text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-list-ul text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">一覧</span>
            </button>
            <button data-target="view-stats" class="nav-tab flex flex-col items-center py-1 text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
                <span class="text-[10px] font-bold">集計</span>
            </button>
        </div>
    </nav>

    <!-- Prefecture Detail / Edit Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modal-content" class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col transform translate-y-full sm:translate-y-0 transition-transform duration-300 shadow-xl overflow-hidden">
            
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div class="flex items-center space-x-2">
                    <span id="modal-pref-badge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-200 text-slate-700">未訪問</span>
                    <h3 id="modal-pref-name" class="text-xl font-bold text-slate-900">都道府県名</h3>
                </div>
                <button id="modal-close" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center hover:bg-slate-300">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Form Body -->
            <div class="p-5 overflow-y-auto space-y-5 flex-1">
                
                <!-- Status Toggle Buttons -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">ステータス</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" data-status="unvisited" class="status-btn py-2.5 px-3 rounded-xl border text-xs font-bold text-slate-600 border-slate-200 hover:bg-slate-50 flex items-center justify-center gap-1.5 transition">
                            <span class="w-2.5 h-2.5 rounded-full bg-slate-300"></span> 未訪問
                        </button>
                        <button type="button" data-status="planned" class="status-btn py-2.5 px-3 rounded-xl border text-xs font-bold text-slate-600 border-slate-200 hover:bg-slate-50 flex items-center justify-center gap-1.5 transition">
                            <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> 計画中
                        </button>
                        <button type="button" data-status="visited" class="status-btn py-2.5 px-3 rounded-xl border text-xs font-bold text-slate-600 border-slate-200 hover:bg-slate-50 flex items-center justify-center gap-1.5 transition">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 訪問済み
                        </button>
                    </div>
                </div>

                <!-- Transportation Mode -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">主な交通手段</label>
                    <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
                        <button type="button" data-trans="電車" class="trans-btn py-2 rounded-lg border text-xs font-medium border-slate-200 text-slate-600 flex flex-col items-center gap-1 hover:bg-slate-50">
                            <i class="fa-solid fa-train"></i> 電車
                        </button>
                        <button type="button" data-trans="新幹線" class="trans-btn py-2 rounded-lg border text-xs font-medium border-slate-200 text-slate-600 flex flex-col items-center gap-1 hover:bg-slate-50">
                            <i class="fa-solid fa-train-subway"></i> 新幹線
                        </button>
                        <button type="button" data-trans="飛行機" class="trans-btn py-2 rounded-lg border text-xs font-medium border-slate-200 text-slate-600 flex flex-col items-center gap-1 hover:bg-slate-50">
                            <i class="fa-solid fa-plane"></i> 飛行機
                        </button>
                        <button type="button" data-trans="車" class="trans-btn py-2 rounded-lg border text-xs font-medium border-slate-200 text-slate-600 flex flex-col items-center gap-1 hover:bg-slate-50">
                            <i class="fa-solid fa-car"></i> 車/レンタカー
                        </button>
                        <button type="button" data-trans="バス" class="trans-btn py-2 rounded-lg border text-xs font-medium border-slate-200 text-slate-600 flex flex-col items-center gap-1 hover:bg-slate-50">
                            <i class="fa-solid fa-bus"></i> バス
                        </button>
                        <button type="button" data-trans="フェリー" class="trans-btn py-2 rounded-lg border text-xs font-medium border-slate-200 text-slate-600 flex flex-col items-center gap-1 hover:bg-slate-50">
                            <i class="fa-solid fa-ship"></i> 船
                        </button>
                    </div>
                </div>

                <!-- Expense Input -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">かかった費用・予算 (円)</label>
                    <div class="relative">
                        <span class="absolute left-3 top-2.5 text-slate-400 font-bold text-sm">¥</span>
                        <input type="number" id="input-expense" min="0" placeholder="0" class="w-full pl-8 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-bold text-base focus:outline-none focus:ring-2 focus:ring-slate-900">
                    </div>
                </div>

                <!-- Notes / Memories -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">思い出メモ・訪れたスポット</label>
                    <textarea id="input-notes" rows="3" placeholder="観光した場所、食べた名物料理などのメモ..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900"></textarea>
                </div>

                <!-- Photo Upload (Up to 3 Photos) -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold text-slate-500 uppercase">写真 (最大3枚)</label>
                        <span id="photo-count-badge" class="text-xs text-slate-400">0/3</span>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <!-- Photo Previews / Slot Cards -->
                        <div id="photo-slot-0" class="photo-slot aspect-square bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 cursor-pointer overflow-hidden relative">
                            <i class="fa-solid fa-plus text-lg"></i>
                            <span class="text-[10px] mt-1">追加</span>
                        </div>
                        <div id="photo-slot-1" class="photo-slot aspect-square bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 cursor-pointer overflow-hidden relative">
                            <i class="fa-solid fa-plus text-lg"></i>
                            <span class="text-[10px] mt-1">追加</span>
                        </div>
                        <div id="photo-slot-2" class="photo-slot aspect-square bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 cursor-pointer overflow-hidden relative">
                            <i class="fa-solid fa-plus text-lg"></i>
                            <span class="text-[10px] mt-1">追加</span>
                        </div>
                    </div>
                    <input type="file" id="photo-input" accept="image/*" class="hidden">
                </div>

            </div>

            <!-- Modal Footer Buttons -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex gap-2">
                <button id="modal-clear" type="button" class="px-4 py-3 rounded-xl border border-slate-200 text-xs font-bold text-slate-500 hover:bg-slate-100 transition">
                    リセット
                </button>
                <button id="modal-save" type="button" class="flex-1 bg-slate-900 text-white font-bold py-3 rounded-xl text-sm shadow-md active:scale-[0.98] transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check"></i> 保存する
                </button>
            </div>
        </div>
    </div>

    <script>
        // 47 Prefectures Data Template
        const PREFECTURES = [
            { id: 1, name: "北海道", region: "北海道" },
            { id: 2, name: "青森県", region: "東北" }, { id: 3, name: "岩手県", region: "東北" },
            { id: 4, name: "宮城県", region: "東北" }, { id: 5, name: "秋田県", region: "東北" },
            { id: 6, name: "山形県", region: "東北" }, { id: 7, name: "福島県", region: "東北" },
            { id: 8, name: "茨城県", region: "関東" }, { id: 9, name: "栃木県", region: "関東" },
            { id: 10, name: "群馬県", region: "関東" }, { id: 11, name: "埼玉県", region: "関東" },
            { id: 12, name: "千葉県", region: "関東" }, { id: 13, name: "東京都", region: "関東" },
            { id: 14, name: "神奈川県", region: "関東" }, { id: 15, name: "新潟県", region: "中部" },
            { id: 16, name: "富山県", region: "中部" }, { id: 17, name: "石川県", region: "中部" },
            { id: 18, name: "福井県", region: "中部" }, { id: 19, name: "山梨県", region: "中部" },
            { id: 20, name: "長野県", region: "中部" }, { id: 21, name: "岐阜県", region: "中部" },
            { id: 22, name: "静岡県", region: "中部" }, { id: 23, name: "愛知県", region: "中部" },
            { id: 24, name: "三重県", region: "関西" }, { id: 25, name: "滋賀県", region: "関西" },
            { id: 26, name: "京都府", region: "関西" }, { id: 27, name: "大阪府", region: "関西" },
            { id: 28, name: "兵庫県", region: "関西" }, { id: 29, name: "奈良県", region: "関西" },
            { id: 30, name: "和歌山県", region: "関西" }, { id: 31, name: "鳥取県", region: "中国" },
            { id: 32, name: "島根県", region: "中国" }, { id: 33, name: "岡山県", region: "中国" },
            { id: 34, name: "広島県", region: "中国" }, { id: 35, name: "山口県", region: "中国" },
            { id: 36, name: "徳島県", region: "四国" }, { id: 37, name: "香川県", region: "四国" },
            { id: 38, name: "愛媛県", region: "四国" }, { id: 39, name: "高知県", region: "四国" },
            { id: 40, name: "福岡県", region: "九州" }, { id: 41, name: "佐賀県", region: "九州" },
            { id: 42, name: "長崎県", region: "九州" }, { id: 43, name: "熊本県", region: "九州" },
            { id: 44, name: "大分県", region: "九州" }, { id: 45, name: "宮崎県", region: "九州" },
            { id: 46, name: "鹿児島県", region: "九州" }, { id: 47, name: "沖縄県", region: "沖縄" }
        ];

        // Global State
        let travelData = {}; // { [id]: { status, expense, trans, notes, photos: [] } }
        let currentEditingId = null;
        let tempPhotos = [];
        let activePhotoTargetIndex = null;

        // Colors for SVG Map
        const STATUS_COLORS = {
            visited: '#10B981', // Emerald green
            planned: '#3B82F6', // Blue
            unvisited: '#CBD5E1' // Slate 300
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            initSVGMap();
            initNavigation();
            initModalEvents();
            initListAndFilters();
            renderAll();
        });

        // Load data from LocalStorage
        function loadData() {
            const saved = localStorage.getItem('jp_travel_tracker_data');
            if (saved) {
                try {
                    travelData = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse saved data', e);
                    travelData = {};
                }
            }
        }

        // Save data to LocalStorage
        function saveData() {
            localStorage.setItem('jp_travel_tracker_data', JSON.stringify(travelData));
            renderAll();
        }

        // Render UI Elements based on State
        function renderAll() {
            updateSummaryStats();
            updateMapColors();
            renderPrefectureList();
            renderStatsView();
        }

        // Update overall summary header stats
        function updateSummaryStats() {
            let visitedCount = 0;
            let plannedCount = 0;

            PREFECTURES.forEach(pref => {
                const data = travelData[pref.id];
                if (data && data.status === 'visited') visitedCount++;
                else if (data && data.status === 'planned') plannedCount++;
            });

            const unvisitedCount = 47 - visitedCount - plannedCount;
            const percent = Math.round((visitedCount / 47) * 100);

            document.getElementById('visited-count').textContent = visitedCount;
            document.getElementById('progress-percent').textContent = `${percent}%`;

            document.getElementById('bar-visited').style.width = `${(visitedCount / 47) * 100}%`;
            document.getElementById('bar-planned').style.width = `${(plannedCount / 47) * 100}%`;

            document.getElementById('legend-visited').textContent = visitedCount;
            document.getElementById('legend-planned').textContent = plannedCount;
            document.getElementById('legend-unvisited').textContent = unvisitedCount;
        }

        function initSVGMap() {
            document.querySelectorAll('.pref-path').forEach(path => {
                path.addEventListener('click', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    openDetailModal(id);
                });
            });
        }

        function updateMapColors() {
            PREFECTURES.forEach(pref => {
                const path = document.getElementById(`pref-${pref.id}`);
                if (!path) return;

                const data = travelData[pref.id];
                const status = data ? (data.status || 'unvisited') : 'unvisited';
                path.style.fill = STATUS_COLORS[status];
            });
        }

        function initModalEvents() {
            const modal = document.getElementById('detail-modal');
            const closeBtn = document.getElementById('modal-close');
            const saveBtn = document.getElementById('modal-save');
            const clearBtn = document.getElementById('modal-clear');
            const photoInput = document.getElementById('photo-input');

            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // Status Option Buttons
            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.status-btn').forEach(b => {
                        b.classList.remove('bg-slate-900', 'text-white', 'border-slate-900');
                        b.classList.add('border-slate-200', 'text-slate-600');
                    });
                    btn.classList.add('bg-slate-900', 'text-white', 'border-slate-900');
                    btn.setAttribute('data-selected', 'true');
                });
            });

            // Transportation Buttons
            document.querySelectorAll('.trans-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const isSelected = btn.classList.contains('bg-emerald-500');
                    document.querySelectorAll('.trans-btn').forEach(b => {
                        b.classList.remove('bg-emerald-500', 'text-white', 'border-emerald-500');
                        b.classList.add('border-slate-200', 'text-slate-600');
                    });
                    if (!isSelected) {
                        btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
                    }
                });
            });

            // Photo Slot Clicks
            [0, 1, 2].forEach(index => {
                const slot = document.getElementById(`photo-slot-${index}`);
                slot.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-photo-btn')) return; // handled separately
                    if (tempPhotos[index]) {
                        // Viewing or replacing existing
                        activePhotoTargetIndex = index;
                    } else {
                        activePhotoTargetIndex = tempPhotos.length;
                    }
                    photoInput.click();
                });
            });

            // Photo Input File Select (DataURL conversion with image compression)
            photoInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    // Resize image using Canvas to fit within LocalStorage
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxDim = 600; // max dimension 600px for local storage optimization
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDim) {
                                height *= maxDim / width;
                                width = maxDim;
                            }
                        } else {
                            if (height > maxDim) {
                                width *= maxDim / height;
                                height = maxDim;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                        if (activePhotoTargetIndex !== null && activePhotoTargetIndex < 3) {
                            tempPhotos[activePhotoTargetIndex] = compressedDataUrl;
                            renderModalPhotos();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
                photoInput.value = ''; // reset
            });

            // Save Record Button
            saveBtn.addEventListener('click', () => {
                if (!currentEditingId) return;

                const selectedStatusBtn = Array.from(document.querySelectorAll('.status-btn')).find(b => b.classList.contains('bg-slate-900'));
                const status = selectedStatusBtn ? selectedStatusBtn.getAttribute('data-status') : 'unvisited';

                const selectedTransBtn = Array.from(document.querySelectorAll('.trans-btn')).find(b => b.classList.contains('bg-emerald-500'));
                const trans = selectedTransBtn ? selectedTransBtn.getAttribute('data-trans') : '';

                const expense = parseInt(document.getElementById('input-expense').value) || 0;
                const notes = document.getElementById('input-notes').value.trim();

                travelData[currentEditingId] = {
                    status: status,
                    trans: trans,
                    expense: expense,
                    notes: notes,
                    photos: tempPhotos.filter(Boolean)
                };

                saveData();
                closeModal();
            });

            // Clear Record Button
            clearBtn.addEventListener('click', () => {
                if (!currentEditingId) return;
                delete travelData[currentEditingId];
                saveData();
                closeModal();
            });
        }

        function openDetailModal(id) {
            currentEditingId = id;
            const pref = PREFECTURES.find(p => p.id === id);
            const data = travelData[id] || { status: 'unvisited', trans: '', expense: '', notes: '', photos: [] };

            document.getElementById('modal-pref-name').textContent = pref.name;
            
            // Set Status Toggle
            document.querySelectorAll('.status-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white', 'border-slate-900');
                btn.classList.add('border-slate-200', 'text-slate-600');
                if (btn.getAttribute('data-status') === (data.status || 'unvisited')) {
                    btn.classList.add('bg-slate-900', 'text-white', 'border-slate-900');
                }
            });

            // Set Transportation Toggle
            document.querySelectorAll('.trans-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-500', 'text-white', 'border-emerald-500');
                btn.classList.add('border-slate-200', 'text-slate-600');
                if (data.trans && btn.getAttribute('data-trans') === data.trans) {
                    btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
                }
            });

            document.getElementById('input-expense').value = data.expense || '';
            document.getElementById('input-notes').value = data.notes || '';

            // Clone photos array for modal scope editing
            tempPhotos = [...(data.photos || [])];
            renderModalPhotos();

            // Show Modal with Animation
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');
            content.classList.remove('translate-y-full');
        }

        function closeModal() {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('pointer-events-none');
                currentEditingId = null;
                tempPhotos = [];
            }, 300);
        }

        function renderModalPhotos() {
            document.getElementById('photo-count-badge').textContent = `${tempPhotos.length}/3`;

            [0, 1, 2].forEach(index => {
                const slot = document.getElementById(`photo-slot-${index}`);
                const photo = tempPhotos[index];

                if (photo) {
                    slot.classList.remove('border-dashed', 'border-slate-300', 'text-slate-400');
                    slot.classList.add('border-solid', 'border-emerald-500');
                    slot.innerHTML = `
                        <img src="${photo}" class="w-full h-full object-cover rounded-lg">
                        <button type="button" onclick="removePhoto(${index}, event)" class="delete-photo-btn absolute top-1 right-1 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center text-xs shadow-md">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    `;
                } else {
                    slot.classList.add('border-dashed', 'border-slate-300', 'text-slate-400');
                    slot.classList.remove('border-solid', 'border-emerald-500');
                    slot.innerHTML = `
                        <i class="fa-solid fa-plus text-lg"></i>
                        <span class="text-[10px] mt-1">追加</span>
                    `;
                }
            });
        }

        window.removePhoto = function(index, e) {
            e.stopPropagation();
            tempPhotos.splice(index, 1);
            renderModalPhotos();
        };

        function initListAndFilters() {
            document.getElementById('search-input').addEventListener('input', renderPrefectureList);
            document.getElementById('status-filter').addEventListener('change', renderPrefectureList);
        }

        function renderPrefectureList() {
            const container = document.getElementById('prefecture-list');
            const search = document.getElementById('search-input').value.trim();
            const filter = document.getElementById('status-filter').value;

            container.innerHTML = '';

            PREFECTURES.filter(pref => {
                const data = travelData[pref.id] || { status: 'unvisited' };
                const matchSearch = pref.name.includes(search) || pref.region.includes(search);
                const matchStatus = filter === 'all' || (data.status || 'unvisited') === filter;
                return matchSearch && matchStatus;
            }).forEach(pref => {
                const data = travelData[pref.id] || { status: 'unvisited' };
                const status = data.status || 'unvisited';

                let badgeColor = 'bg-slate-100 text-slate-600';
                let statusText = '未訪問';
                if (status === 'visited') { badgeColor = 'bg-emerald-100 text-emerald-800 font-bold'; statusText = '訪問済み'; }
                if (status === 'planned') { badgeColor = 'bg-blue-100 text-blue-800 font-bold'; statusText = '計画中'; }

                const el = document.createElement('div');
                el.className = 'bg-white p-3.5 rounded-xl border border-slate-200 flex items-center justify-between shadow-sm cursor-pointer hover:border-slate-300 active:scale-[0.99] transition';
                el.onclick = () => openDetailModal(pref.id);

                el.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="w-3 h-3 rounded-full" style="background-color: ${STATUS_COLORS[status]}"></span>
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-slate-800 text-base">${pref.name}</h4>
                                <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-medium">${pref.region}</span>
                            </div>
                            ${data.trans || data.expense ? `
                                <div class="text-xs text-slate-500 mt-1 flex items-center gap-3">
                                    ${data.trans ? `<span><i class="fa-solid fa-plane-arrival text-slate-400 mr-1"></i>${data.trans}</span>` : ''}
                                    ${data.expense ? `<span><i class="fa-solid fa-yen-sign text-slate-400 mr-1"></i>¥${data.expense.toLocaleString()}</span>` : ''}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        ${data.photos && data.photos.length ? `<span class="text-xs text-slate-400"><i class="fa-regular fa-image"></i> ${data.photos.length}</span>` : ''}
                        <span class="text-xs px-2.5 py-1 rounded-lg ${badgeColor}">${statusText}</span>
                    </div>
                `;

                container.appendChild(el);
            });
        }

        function renderStatsView() {
            let totalExpense = 0;
            let totalRecordedCount = 0;
            const transCounts = {};

            Object.values(travelData).forEach(item => {
                if (item.expense) {
                    totalExpense += item.expense;
                    totalRecordedCount++;
                }
                if (item.trans) {
                    transCounts[item.trans] = (transCounts[item.trans] || 0) + 1;
                }
            });

            document.getElementById('total-expense').textContent = `¥${totalExpense.toLocaleString()}`;
            document.getElementById('recorded-count').textContent = `${totalRecordedCount} 都道府県`;
            document.getElementById('avg-expense').textContent = `¥${totalRecordedCount > 0 ? Math.round(totalExpense / totalRecordedCount).toLocaleString() : 0}`;

            const transContainer = document.getElementById('trans-stats-list');
            transContainer.innerHTML = '';

            const modes = [
                { name: '電車', icon: 'fa-train' },
                { name: '新幹線', icon: 'fa-train-subway' },
                { name: '飛行機', icon: 'fa-plane' },
                { name: '車', icon: 'fa-car' },
                { name: 'バス', icon: 'fa-bus' },
                { name: 'フェリー', icon: 'fa-ship' }
            ];

            modes.forEach(mode => {
                const count = transCounts[mode.name] || 0;
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between text-sm py-1 border-b border-slate-50 last:border-0';
                row.innerHTML = `
                    <div class="flex items-center space-x-2 text-slate-700">
                        <i class="fa-solid ${mode.icon} w-5 text-emerald-600"></i>
                        <span>${mode.name}</span>
                    </div>
                    <span class="font-bold text-slate-900">${count} 回</span>
                `;
                transContainer.appendChild(row);
            });
        }

        // Navigation tab click handlers
        function initNavigation() {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const target = tab.getAttribute('data-target');

                    document.querySelectorAll('.nav-tab').forEach(t => {
                        t.classList.remove('text-emerald-600');
                        t.classList.add('text-slate-400');
                    });
                    tab.classList.add('text-emerald-600');

                    document.querySelectorAll('.view-content').forEach(view => {
                        view.classList.add('hidden');
                    });
                    document.getElementById(target).classList.remove('hidden');
                });
            });

            // Data Export/Import
            document.getElementById('export-btn').addEventListener('click', () => {
                const blob = new Blob([JSON.stringify(travelData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `japan_travel_data_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            });

            const importFile = document.getElementById('import-file');
            document.getElementById('import-btn').addEventListener('click', () => importFile.click());
            importFile.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        travelData = JSON.parse(event.target.result);
                        saveData();
                        alert('データを復元しました！');
                    } catch (err) {
                        alert('JSONファイルの読み込みに失敗しました。');
                    }
                };
                reader.readAsText(file);
            });
        }
    </script>
